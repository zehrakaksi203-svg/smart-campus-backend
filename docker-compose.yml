services:
  postgres:
    image: postgres:16
    container_name: smart-campus-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_campus
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: smart-campus-backend
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      PORT: 3001
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/uploads:/app/src/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../smart-campus-frontend
      args:
        VITE_API_URL: /api/v1
    container_name: smart-campus-frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: